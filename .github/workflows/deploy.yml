# Publishes the site to GitHub Pages on every push to main.
#
# No secrets are involved. GITHUB_TOKEN is issued automatically for this
# run, scoped to this repository, and discarded when the job ends -- so
# there is no personal access token to create, store, rotate or leak.
#
# First run: Settings -> Pages -> Source: GitHub Actions
# (usually not needed, the workflow enables it on the first successful build)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read        # read the repo
  pages: write          # upload the built site
  id-token: write       # sign the deployment (this is what "Deploy" means)

# Let a new push supersede a running one, but never cancel mid-deploy
# in a way that leaves Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site is plain static files, so "building" is just collecting
      # them. Everything the browser needs is already committed.
      - name: Collect static files
        run: |
          mkdir -p _site
          cp -r index.html css js audio _site/
          # Fail loudly rather than shipping a site with a missing script.
          test -f _site/audio/manifest.js
          test -f _site/js/data/vocab.js
          echo "files: $(find _site -type f | wc -l)"
          echo "size:  $(du -sh _site | cut -f1)"

      # GitHub Pages serves every file with Cache-Control: max-age=600.
      # Without this a browser can hold the OLD app.js while fetching the
      # NEW index.html, and the pair no longer match -- which showed up as a
      # blank home screen for up to ten minutes after a deploy. Tagging
      # local references with the commit sha means each commit pulls a
      # self-consistent set of files instead of a mixture.
      - name: Version local asset references
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          v = os.environ["GITHUB_SHA"][:10]
          site = pathlib.Path("_site")

          # index.html: local paths only, never the CDN or absolute URLs.
          # The pattern's closing quote is part of the match but not part of
          # either group, so the replacement has to put it back itself.
          html = site / "index.html"
          text = html.read_text(encoding="utf-8")

          def tag(m):
              path = m.group(2)
              if path.startswith(("http", "//", "#", "data:")) or "?" in path:
                  return m.group(0)
              return m.group(1) + path + "?v=" + v + '"'

          text = re.sub(r'(src="|href=")([^"]+)"', tag, text)
          html.write_text(text, encoding="utf-8")

          # audio/manifest.js: a re-recorded clip keeps its filename, so tag
          # those paths too or pupils keep hearing the old recording
          mf = site / "audio" / "manifest.js"
          text = mf.read_text(encoding="utf-8")
          text = re.sub(r'(\.mp3)(?=")', r'\1?v=' + v, text)
          mf.write_text(text, encoding="utf-8")

          print("tagged local references with v=" + v)
          PY

      # Guard: a malformed rewrite must fail the build, not ship a site
      # where no script tag ever closes. This caught exactly that mistake.
      - name: Verify the rewritten site
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          html = pathlib.Path("_site/index.html").read_text(encoding="utf-8")
          problems = []

          # every script tag must be well formed
          for m in re.finditer(r'<script[^>]*>', html):
              if not m.group(0).endswith(">"):
                  problems.append("malformed tag: " + m.group(0)[:60])
          opens = html.count("<script")
          closes = html.count("</script>")
          if opens != closes:
              problems.append(f"{opens} <script> vs {closes} </script>")

          # a known-good reference must survive the rewrite intact
          if 'src="js/app.js?v=' not in html:
              problems.append("js/app.js was not tagged correctly")
          if "</script>" not in html:
              problems.append("no closing script tags found")

          # no attribute value may have swallowed markup
          for m in re.finditer(r'(?:src|href)="([^"]*)"', html):
              if "<" in m.group(1) or ">" in m.group(1):
                  problems.append("attribute swallowed markup: " + m.group(1)[:60])
                  break

          if problems:
              for p in problems:
                  print("FAIL:", p)
              sys.exit(1)
          print("index.html rewrite verified")
          PY

      # Guard: the manifest must describe every clip the game can ask for.
      # A partial `--only` render once rewrote it with only 24 of 373
      # entries; the game still "worked" by silently falling back to Web
      # Speech, which is far easier to miss than a failed build.
      # validate.py is standard library only, so no setup is needed.
      - name: Validate vocabulary and audio pack
        run: python3 tools/validate.py

      # Guard: every script must parse. A doubled comma once took six topic
      # files out of the running game and the site still deployed "success".
      # GitHub runners have node, so use it to check rather than a browser.
      - name: Syntax check every script
        run: |
          set -e
          failed=0
          while IFS= read -r f; do
            if ! node --check "$f" 2>/tmp/err; then
              echo "SYNTAX ERROR in $f"
              cat /tmp/err
              failed=1
            fi
          done < <(find _site -name '*.js')
          if [ "$failed" -ne 0 ]; then
            echo "refusing to publish: a script does not parse"
            exit 1
          fi
          echo "all scripts parse"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
