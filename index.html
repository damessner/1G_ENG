<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1226">
<title>Word Quest &mdash; English Games</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ============ HOME ============ -->
  <section class="screen" data-screen="home">
    <header class="home-head">
      <div class="pupil">
        <div class="avatar" id="avatar">?</div>
        <div class="pupil-meta">
          <div class="pupil-name" id="pupilName">Friend</div>
          <div class="rank-line">
            <span class="rank" id="rankName">Newcomer</span>
            <span class="sep">&middot;</span>
            <span class="xp" id="xpText">0 XP</span>
          </div>
          <div class="xp-bar" aria-label="Progress to next rank">
            <div class="xp-fill" id="xpFill"></div>
          </div>
        </div>
        <button class="icon-btn" id="btnSettings" title="Settings" aria-label="Settings">&#9881;</button>
      </div>
      <div class="streak-chip" id="streakChip" hidden>
        <span class="flame">&#128293;</span> <span id="streakDays">0</span> day streak
      </div>
    </header>

    <div class="home-scroll">
      <h2 class="section-title">Choose a unit</h2>
      <div class="unit-grid" id="unitGrid"></div>

      <h2 class="section-title">Trophies</h2>
      <div class="badge-grid" id="badgeGrid"></div>

      <div class="reset-wrap">
        <button class="link-btn" id="btnReset">Reset all progress</button>
      </div>
    </div>
  </section>

  <!-- ============ UNIT: pick a level straight away ============ -->
  <section class="screen" data-screen="unit">
    <header class="sub-head">
      <button class="icon-btn" data-nav="home" aria-label="Back">&#8592;</button>
      <div class="sub-title-wrap">
        <div class="sub-title" id="unitTitle">Unit</div>
        <div class="sub-sub" id="unitSub"></div>
      </div>
      <div class="topic-stars" id="unitStars">0/0</div>
    </header>
    <div class="unit-scroll" id="unitScroll"></div>
  </section>

  <!-- ============ GAME ============ -->
  <section class="screen" data-screen="game">
    <header class="game-head">
      <button class="icon-btn" id="btnQuit" aria-label="Quit">&times;</button>
      <div class="progress-dots" id="progressDots"></div>
      <button class="replay-btn" id="btnReplay" title="Hear it again" aria-label="Hear the question again">&#128266;</button>
      <button class="voice-btn" id="btnVoice" title="Switch voice" aria-label="Switch voice" hidden>&#128100;</button>
      <div class="hud-streak" id="hudStreak" hidden><span id="hudStreakNum">0</span>&#9889;</div>
    </header>

    <div class="stage" id="stage">
      <div class="prompt-box" id="promptBox"><!-- built per question by the engine --></div>
      <div class="answer-area" id="answerArea"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section class="screen" data-screen="result">
    <div class="result-wrap" id="resultWrap"></div>
  </section>

</div>

<div id="fx" aria-hidden="true"></div>
<div id="modal-root"></div>

<script>
  /* Minimal registry. Topic packs call LG.registerTopic() as they load,
     and index.html decides the order they appear on the home screen. */
  window.LG = window.LG || {};
  LG.topics = [];
  LG._pending = {};
  /* levels.js files stage their levels here, then index.js wraps them
     with the topic's name, icon and colour. */
  LG.topicData = function (id, levels) { LG._pending[id] = levels; };
  LG.registerTopic = function (topic) { LG.topics.push(topic); LG.Units.place(topic); };
</script>

<!-- ============ GENERATED BY tools/build_audio.py ============ -->
<script src="audio/manifest.js"></script>
<script src="js/data/vocab.js"></script>

<!-- ============ CORE ============ -->
<script src="js/core/storage.js"></script>
<script src="js/core/speech.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/gamification.js"></script>
<script src="js/core/units.js"></script>
<script src="js/core/questions.js"></script>

<!-- ============ GAME MODES (generic; topic-agnostic) ============ -->
<script src="js/modes/choice.js"></script>
<script src="js/modes/assemble.js"></script>
<script src="js/modes/quantity.js"></script>

<!-- ============ UNIT PACKS ============
     To add a unit: create js/units/<id>/index.js, drop topic folders in
     beside it, and copy the block below. The order of the script tags is
     the order topics appear on the home screen. -->
<script src="js/units/unit1/index.js"></script>

<script src="js/units/unit1/alphabet/levels.js"></script>
<script src="js/units/unit1/alphabet/index.js"></script>
<script src="js/units/unit1/numbers/levels.js"></script>
<script src="js/units/unit1/numbers/index.js"></script>
<script src="js/units/unit1/colors/levels.js"></script>
<script src="js/units/unit1/colors/index.js"></script>
<script src="js/units/unit1/classroom/levels.js"></script>
<script src="js/units/unit1/classroom/index.js"></script>
<script src="js/units/unit1/plurals/levels.js"></script>
<script src="js/units/unit1/plurals/index.js"></script>
<script src="js/units/unit1/spellname/levels.js"></script>
<script src="js/units/unit1/spellname/index.js"></script>
<script src="js/units/unit1/soundsz/levels.js"></script>
<script src="js/units/unit1/soundsz/index.js"></script>
<script src="js/units/unit1/instructions/levels.js"></script>
<script src="js/units/unit1/instructions/index.js"></script>

<!-- ============ BOOT ============ -->
<script src="js/core/engine.js"></script>
<script src="js/app.js"></script>

</body>
</html>
